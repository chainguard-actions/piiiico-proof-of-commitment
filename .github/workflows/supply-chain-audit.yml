name: Supply Chain Audit

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch: {}

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Commit Supply Chain Audit
        uses: piiiico/commit-action@fc890899bde18ae82c77f4ab5cb0a12c1c660a67 # v1
        with:
          fail-on-critical: false
          max-packages: '20'
          comment-on-pr: true
          include-dev-dependencies: false
