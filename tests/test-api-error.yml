name: Test API error causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Commit API (error500 mode)
        run: |
          rm -f /tmp/mock-api-18088.log
          setsid nohup python3 tests/fixtures/mock_api.py 18088 error500 /tmp/mock-api-18088.log > /tmp/mock-server-18088.out 2>&1 &
          for i in $(seq 1 40); do
            curl -s http://127.0.0.1:18088/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18088/ || { cat /tmp/mock-server-18088.out; exit 1; }
      - id: action
        uses: .
        continue-on-error: true
        with:
          packages: 'safe-alpha'
          api-url: http://127.0.0.1:18088
      - name: Assert failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure on HTTP 500"; exit 1; fi
          grep -q 'safe-alpha' /tmp/mock-api-18088.log || { echo "FAIL: API not called"; exit 1; }
          echo "PASS"
