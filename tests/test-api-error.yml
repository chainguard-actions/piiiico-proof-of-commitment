name: Test API error fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake curl for the audit API
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin" /tmp/fake-curl
          rm -f /tmp/fake-curl/payloads.log
          echo error500 > /tmp/fake-curl/mode
          cp tests/fixtures/fake-curl.py "$RUNNER_TEMP/fakebin/curl"
          chmod +x "$RUNNER_TEMP/fakebin/curl"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          packages: 'lodash'
          api-url: http://audit.invalid
          comment-on-pr: 'false'
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-critical: '$HAS_CRITICAL'"
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure on HTTP 500"; exit 1; fi
          if [ -n "$HAS_CRITICAL" ]; then echo "FAIL: no outputs expected on API error"; exit 1; fi
          echo "PASS"
