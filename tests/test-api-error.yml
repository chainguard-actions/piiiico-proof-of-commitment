name: Test API HTTP 500 error fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock audit API
        run: |
          rm -f /tmp/mock-api-requests.log
          setsid nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_api.py" 8765 > /tmp/mock-api.out 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8765/ >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8765/ || { cat /tmp/mock-api.out; exit 1; }
      - id: action
        uses: .
        continue-on-error: true
        with:
          packages: 'okpkg'
          api-url: http://127.0.0.1:8765/error500
          comment-on-pr: 'false'
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/mock-api-requests.log || true
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on HTTP 500 from API"
            exit 1
          fi
          echo "PASS"
