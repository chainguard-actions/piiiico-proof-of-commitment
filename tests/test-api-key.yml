name: Test api-key sends Authorization header
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Commit API
        run: |
          rm -f /tmp/mock-requests-key.log
          nohup python3 tests/fixtures/mock_server.py ok 18089 /tmp/mock-requests-key.log > /tmp/mock-server-key.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:18089/ >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:18089/ || { cat /tmp/mock-server-key.log; exit 1; }
      - id: action
        uses: .
        with:
          packages: 'express,lodash'
          api-url: http://127.0.0.1:18089
          api-key: test-pro-key-123
          comment-on-pr: 'false'
      - name: Assert bearer token sent
        env:
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL_COUNT"
          [ "$CRITICAL_COUNT" = "0" ] || { echo "FAIL: critical-count should be 0"; exit 1; }
          python3 - <<'EOF'
          import json
          lines = [json.loads(l) for l in open('/tmp/mock-requests-key.log') if l.strip()]
          assert len(lines) == 1, f"expected 1 request, got {len(lines)}"
          assert lines[0]['auth'] == 'Bearer test-pro-key-123', lines[0]['auth']
          print("PASS")
          EOF
