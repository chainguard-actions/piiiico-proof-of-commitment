name: Test audit summary output format
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          packages: "chalk"
          ecosystem: npm
          fail-on-critical: "false"
          comment-on-pr: "false"

      - name: Assert audit-summary contains expected markdown structure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          AUDIT_SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "audit-summary:"
          echo "$AUDIT_SUMMARY"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$AUDIT_SUMMARY" ]; then
              echo "FAIL: audit-summary output is empty"
              exit 1
            fi
            # Check for the HTML comment marker used for PR comment deduplication
            if ! echo "$AUDIT_SUMMARY" | grep -q "commit-supply-chain-audit"; then
              echo "FAIL: audit-summary missing commit-supply-chain-audit marker"
              exit 1
            fi
            # Check for the markdown table header columns
            if ! echo "$AUDIT_SUMMARY" | grep -q "Package"; then
              echo "FAIL: audit-summary missing 'Package' column header"
              exit 1
            fi
            if ! echo "$AUDIT_SUMMARY" | grep -q "Risk"; then
              echo "FAIL: audit-summary missing 'Risk' column header"
              exit 1
            fi
            if ! echo "$AUDIT_SUMMARY" | grep -q "Score"; then
              echo "FAIL: audit-summary missing 'Score' column header"
              exit 1
            fi
            # Check for the package name in the table
            if ! echo "$AUDIT_SUMMARY" | grep -q "chalk"; then
              echo "FAIL: audit-summary does not contain audited package 'chalk'"
              exit 1
            fi
            echo "PASS: audit-summary has expected markdown structure"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API unreachable or rate-limited under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
