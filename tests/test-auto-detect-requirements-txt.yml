name: Test auto-detect from requirements.txt
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test requirements.txt
        run: |
          cat > /tmp/test-requirements.txt << 'EOF'
          # Test requirements
          requests>=2.28.0
          boto3>=1.26.0
          EOF

      - id: action
        uses: .
        with:
          packages-file: /tmp/test-requirements.txt
          ecosystem: pypi
          fail-on-critical: "false"
          comment-on-pr: "false"
          max-packages: "5"

      - name: Assert has-critical output is set
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
        run: |
          echo "has-critical: $HAS_CRITICAL"
          if [ -z "$HAS_CRITICAL" ]; then
            echo "FAIL: has-critical output is empty"
            exit 1
          fi
          if [ "$HAS_CRITICAL" != "true" ] && [ "$HAS_CRITICAL" != "false" ]; then
            echo "FAIL: has-critical must be 'true' or 'false', got: $HAS_CRITICAL"
            exit 1
          fi
          echo "PASS: has-critical=$HAS_CRITICAL"

      - name: Assert critical-count is a number
        env:
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL_COUNT"
          if [ -z "$CRITICAL_COUNT" ]; then
            echo "FAIL: critical-count output is empty"
            exit 1
          fi
          if ! echo "$CRITICAL_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: critical-count must be a number, got: $CRITICAL_COUNT"
            exit 1
          fi
          echo "PASS: critical-count=$CRITICAL_COUNT"

      - name: Assert audit-summary is present
        env:
          AUDIT_SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "audit-summary length: ${#AUDIT_SUMMARY}"
          if [ -z "$AUDIT_SUMMARY" ]; then
            echo "FAIL: audit-summary output is empty"
            exit 1
          fi
          if ! echo "$AUDIT_SUMMARY" | grep -q "Supply Chain Audit"; then
            echo "FAIL: audit-summary does not contain expected header"
            exit 1
          fi
          echo "PASS: audit-summary is present"
