name: Test basic explicit packages audit
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          packages: "lodash,axios"
          ecosystem: npm
          fail-on-critical: "false"
          comment-on-pr: "false"

      - name: Assert action ran and produced outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
          AUDIT_SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-critical: $HAS_CRITICAL"
          echo "critical-count: $CRITICAL_COUNT"
          echo "audit-summary length: ${#AUDIT_SUMMARY}"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — validate outputs
            if [ -z "$HAS_CRITICAL" ]; then
              echo "FAIL: has-critical output is empty"
              exit 1
            fi
            if [ -z "$CRITICAL_COUNT" ]; then
              echo "FAIL: critical-count output is empty"
              exit 1
            fi
            if [ -z "$AUDIT_SUMMARY" ]; then
              echo "FAIL: audit-summary output is empty"
              exit 1
            fi
            # audit-summary should contain the table header
            if ! echo "$AUDIT_SUMMARY" | grep -q "Supply Chain Audit"; then
              echo "FAIL: audit-summary does not contain expected header"
              exit 1
            fi
            echo "PASS: action succeeded with valid outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API unreachable or rate-limited under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
