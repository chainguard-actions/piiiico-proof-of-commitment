name: Test basic manual packages (no critical)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock audit API
        run: |
          rm -f /tmp/mock-api-requests.log
          setsid nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_api.py" 8765 > /tmp/mock-api.out 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8765/ >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8765/ || { cat /tmp/mock-api.out; exit 1; }
      - id: action
        uses: .
        with:
          packages: 'okpkg-one, stalepkg-two ,highpkg-three'
          api-url: http://127.0.0.1:8765
          comment-on-pr: 'false'
      - name: Assert outputs
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
          SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "has-critical: $HAS_CRITICAL"
          echo "critical-count: $CRITICAL_COUNT"
          echo "summary: $SUMMARY"
          cat /tmp/mock-api-requests.log
          [ "$HAS_CRITICAL" = "false" ] || { echo "FAIL: has-critical should be false"; exit 1; }
          [ "$CRITICAL_COUNT" = "0" ] || { echo "FAIL: critical-count should be 0"; exit 1; }
          for p in okpkg-one stalepkg-two highpkg-three; do
            echo "$SUMMARY" | grep -q "\`$p\`" || { echo "FAIL: summary missing $p"; exit 1; }
          done
          echo "$SUMMARY" | grep -q "Supply Chain Audit" || { echo "FAIL: missing heading"; exit 1; }
          echo "$SUMMARY" | grep -q "HIGH risk" || { echo "FAIL: missing HIGH headline"; exit 1; }
          echo "$SUMMARY" | grep -q "commit-supply-chain-audit" || { echo "FAIL: missing marker"; exit 1; }
          # Packages should be trimmed and sent in a single batch request
          python3 - <<'EOF'
          import json
          lines = [json.loads(l) for l in open('/tmp/mock-api-requests.log') if l.strip()]
          posts = [l for l in lines if l['path'].endswith('/api/audit')]
          assert len(posts) == 1, posts
          assert posts[0]['packages'] == ['okpkg-one', 'stalepkg-two', 'highpkg-three'], posts[0]
          assert posts[0]['auth'] == '', posts[0]
          print('PASS: request payload correct')
          EOF
          echo "PASS"
