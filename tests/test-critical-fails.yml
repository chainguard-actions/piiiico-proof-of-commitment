name: Test critical package fails workflow by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake curl for the audit API
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin" /tmp/fake-curl
          rm -f /tmp/fake-curl/payloads.log
          echo ok > /tmp/fake-curl/mode
          cp tests/fixtures/fake-curl.py "$RUNNER_TEMP/fakebin/curl"
          chmod +x "$RUNNER_TEMP/fakebin/curl"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          packages: 'critical-axios'
          api-url: http://audit.invalid
          comment-on-pr: 'false'
      - name: Assert step failed due to critical package
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when CRITICAL found with fail-on-critical true"
            exit 1
          fi
          echo "PASS"
