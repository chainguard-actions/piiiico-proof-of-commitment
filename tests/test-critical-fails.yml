name: Test CRITICAL package fails the step by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Commit API
        run: |
          rm -f /tmp/mock-requests-critfail.log
          nohup python3 tests/fixtures/mock_server.py critical 18083 /tmp/mock-requests-critfail.log > /tmp/mock-server-critfail.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:18083/ >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:18083/ || { cat /tmp/mock-server-critfail.log; exit 1; }
      - id: action
        uses: .
        continue-on-error: true
        with:
          packages: 'axios'
          api-url: http://127.0.0.1:18083
          comment-on-pr: 'false'
      - name: Assert step failed due to CRITICAL
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "has-critical: $HAS_CRITICAL"
          echo "critical-count: $CRITICAL_COUNT"
          echo "request log:"
          cat /tmp/mock-requests-critfail.log || true
          [ "$OUTCOME" = "failure" ] || { echo "FAIL: expected failure outcome"; exit 1; }
          if [ -n "$HAS_CRITICAL" ] && [ "$HAS_CRITICAL" != "true" ]; then
            echo "FAIL: has-critical should be true when set"; exit 1
          fi
          if [ -n "$CRITICAL_COUNT" ] && [ "$CRITICAL_COUNT" != "1" ]; then
            echo "FAIL: critical-count should be 1 when set"; exit 1
          fi
          grep -q 'axios' /tmp/mock-requests-critfail.log || { echo "FAIL: API not called with axios"; exit 1; }
          echo "PASS"
