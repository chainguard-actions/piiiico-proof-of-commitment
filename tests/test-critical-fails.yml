name: Test critical package fails workflow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local audit API stub
        run: |
          rm -f /tmp/mock-requests.jsonl
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_api.py" 8765 ok > /tmp/mock.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -s http://127.0.0.1:8765/ >/dev/null; then echo "stub up"; exit 0; fi
            sleep 0.5
          done
          cat /tmp/mock.log
          exit 1
      - id: action
        uses: .
        continue-on-error: true
        with:
          packages: 'crit-bigpkg,safe-pkg'
          api-url: http://127.0.0.1:8765
          comment-on-pr: 'false'
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/mock-requests.jsonl
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to CRITICAL package"
            exit 1
          fi
          echo "PASS"
