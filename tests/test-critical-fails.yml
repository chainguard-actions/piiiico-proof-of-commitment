name: Test critical package fails workflow by default
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Commit API
        run: |
          nohup setsid python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_api.py" 18080 > /tmp/mock-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/ >/dev/null; then echo "mock up"; exit 0; fi
            sleep 0.5
          done
          cat /tmp/mock-api.log; exit 1
      - id: action
        uses: .
        continue-on-error: true
        with:
          packages: 'crit-axios,ok-other'
          api-url: http://127.0.0.1:18080
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when CRITICAL package found with fail-on-critical=true"
            exit 1
          fi
          echo "PASS"
