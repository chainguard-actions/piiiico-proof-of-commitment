name: Test empty package list
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local audit API stub
        run: |
          rm -f /tmp/mock-requests.jsonl
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_api.py" 8765 error > /tmp/mock.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -s http://127.0.0.1:8765/ >/dev/null; then echo "stub up"; exit 0; fi
            sleep 0.5
          done
          cat /tmp/mock.log
          exit 1
      - id: action
        uses: .
        with:
          packages-file: tests/fixtures/empty/package.json
          api-url: http://127.0.0.1:8765
          comment-on-pr: 'false'
      - name: Assert nothing audited
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
          SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "has-critical: '$HAS_CRITICAL'"
          echo "summary: '$SUMMARY'"
          if [ -f /tmp/mock-requests.jsonl ] && grep -q '/api/audit' /tmp/mock-requests.jsonl; then
            echo "FAIL: API should not be called for empty package list"
            exit 1
          fi
          [ -z "$HAS_CRITICAL" ] || { echo "FAIL: has-critical should be unset"; exit 1; }
          [ -z "$SUMMARY" ] || { echo "FAIL: summary should be unset"; exit 1; }
          echo "PASS"
