name: Test fail-on-critical false does not fail workflow
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use a single well-known package; with fail-on-critical=false the action
      # must succeed regardless of the risk level returned by the API.
      - id: action
        uses: .
        with:
          packages: "react"
          ecosystem: npm
          fail-on-critical: "false"
          comment-on-pr: "false"

      - name: Assert action succeeded and outputs are set
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
          AUDIT_SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "has-critical: $HAS_CRITICAL"
          echo "critical-count: $CRITICAL_COUNT"
          echo "audit-summary length: ${#AUDIT_SUMMARY}"

          if [ -z "$HAS_CRITICAL" ]; then
            echo "FAIL: has-critical output is empty"
            exit 1
          fi
          if [ -z "$CRITICAL_COUNT" ]; then
            echo "FAIL: critical-count output is empty"
            exit 1
          fi
          if [ -z "$AUDIT_SUMMARY" ]; then
            echo "FAIL: audit-summary output is empty"
            exit 1
          fi
          echo "PASS: action completed successfully with fail-on-critical=false"
