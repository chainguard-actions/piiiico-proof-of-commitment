name: Test fail-on-critical false does not fail workflow
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-org/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          packages: "react,lodash,express,axios,chalk"
          ecosystem: npm
          fail-on-critical: "false"
          comment-on-pr: "false"
          max-packages: "5"

      - name: Assert action did not fail (fail-on-critical is false)
        run: |
          echo "PASS: action completed without failing (fail-on-critical: false)"

      - name: Assert has-critical output is boolean
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
        run: |
          echo "has-critical: $HAS_CRITICAL"
          if [ "$HAS_CRITICAL" != "true" ] && [ "$HAS_CRITICAL" != "false" ]; then
            echo "FAIL: expected has-critical to be 'true' or 'false', got '$HAS_CRITICAL'"
            exit 1
          fi
          echo "PASS: has-critical='$HAS_CRITICAL'"

      - name: Assert critical-count is a non-negative integer
        env:
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL_COUNT"
          if ! echo "$CRITICAL_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected critical-count to be a non-negative integer, got '$CRITICAL_COUNT'"
            exit 1
          fi
          echo "PASS: critical-count='$CRITICAL_COUNT'"

      - name: Assert audit-summary contains markdown table header
        env:
          AUDIT_SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "audit-summary length: ${#AUDIT_SUMMARY}"
          if [ -z "$AUDIT_SUMMARY" ]; then
            echo "FAIL: expected audit-summary to be non-empty"
            exit 1
          fi
          if ! echo "$AUDIT_SUMMARY" | grep -q "Package"; then
            echo "FAIL: expected audit-summary to contain markdown table header 'Package'"
            exit 1
          fi
          echo "PASS: audit-summary contains table header"
