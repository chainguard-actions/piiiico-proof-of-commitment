name: Test max-packages limit
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create package.json with many dependencies
        run: |
          cat > /tmp/many-deps-package.json << 'EOF'
          {
            "name": "many-deps-project",
            "version": "1.0.0",
            "dependencies": {
              "lodash": "^4.0.0",
              "express": "^4.0.0",
              "axios": "^1.0.0",
              "react": "^18.0.0",
              "vue": "^3.0.0"
            }
          }
          EOF

      # With max-packages=2, only 2 packages should be audited
      - id: action
        uses: .
        with:
          packages-file: /tmp/many-deps-package.json
          max-packages: "2"
          fail-on-critical: "false"
          comment-on-pr: "false"

      - name: Assert audit ran and outputs are set
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
          AUDIT_SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "has-critical: $HAS_CRITICAL"
          echo "critical-count: $CRITICAL_COUNT"
          echo "audit-summary: $AUDIT_SUMMARY"

          if [ -z "$HAS_CRITICAL" ]; then
            echo "FAIL: has-critical output is empty"
            exit 1
          fi
          if [ -z "$CRITICAL_COUNT" ]; then
            echo "FAIL: critical-count output is empty"
            exit 1
          fi
          if [ -z "$AUDIT_SUMMARY" ]; then
            echo "FAIL: audit-summary output is empty"
            exit 1
          fi
          echo "PASS: max-packages limit respected, audit completed"
