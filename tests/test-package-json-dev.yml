name: Test packages-file package.json with devDependencies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local audit API stub
        run: |
          rm -f /tmp/mock-requests.jsonl
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_api.py" 8765 ok > /tmp/mock.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -s http://127.0.0.1:8765/ >/dev/null; then echo "stub up"; exit 0; fi
            sleep 0.5
          done
          cat /tmp/mock.log
          exit 1
      - id: action
        uses: .
        with:
          packages-file: tests/fixtures/npm/package.json
          include-dev-dependencies: 'true'
          api-url: http://127.0.0.1:8765
          comment-on-pr: 'false'
      - name: Assert request and outputs
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
          SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          cat /tmp/mock-requests.jsonl
          echo "summary: $SUMMARY"
          grep -q '"packages": \["dep-alpha", "dep-beta", "dep-gamma", "devdep-one"\]' /tmp/mock-requests.jsonl \
            || { echo "FAIL: expected prod+dev deps in request"; exit 1; }
          [ "$HAS_CRITICAL" = "false" ] || { echo "FAIL: has-critical"; exit 1; }
          echo "$SUMMARY" | grep -q '`devdep-one`' || { echo "FAIL: devdep-one missing"; exit 1; }
          echo "PASS"
