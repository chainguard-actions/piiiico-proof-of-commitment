name: Test packages-file package.json with max-packages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Commit API
        run: |
          rm -f /tmp/mock-requests-max.log
          nohup python3 tests/fixtures/mock_server.py ok 18085 /tmp/mock-requests-max.log > /tmp/mock-server-max.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:18085/ >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:18085/ || { cat /tmp/mock-server-max.log; exit 1; }
      - id: action
        uses: .
        with:
          packages-file: tests/fixtures/npm/package.json
          max-packages: '2'
          api-url: http://127.0.0.1:18085
          comment-on-pr: 'false'
      - name: Assert only first 2 prod deps audited
        env:
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL_COUNT"
          cat /tmp/mock-requests-max.log
          [ "$CRITICAL_COUNT" = "0" ] || { echo "FAIL: critical-count should be 0"; exit 1; }
          python3 - <<'EOF'
          import json
          lines = [json.loads(l) for l in open('/tmp/mock-requests-max.log') if l.strip()]
          assert len(lines) == 1, f"expected 1 request, got {len(lines)}"
          pkgs = json.loads(lines[0]['body'])['packages']
          assert pkgs == ['express', 'lodash'], pkgs
          print("PASS: payload", pkgs)
          EOF
