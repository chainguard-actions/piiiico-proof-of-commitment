name: Test auto-detect from package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          packages-file: '${{ github.workspace }}/tests/fixtures/test-package.json'
          ecosystem: 'npm'
          fail-on-critical: 'false'
          comment-on-pr: 'false'
          include-dev-dependencies: 'false'
          max-packages: '5'
        continue-on-error: true

      - name: Assert outputs are valid when API is available
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
          AUDIT_SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "has-critical: $HAS_CRITICAL"
          echo "audit-summary length: ${#AUDIT_SUMMARY}"

          # If all outputs are empty, the API was likely unavailable — skip assertions
          if [ -z "$HAS_CRITICAL" ] && [ -z "$AUDIT_SUMMARY" ]; then
            echo "WARN: all outputs are empty — API likely unavailable or action failed; skipping assertions"
            exit 0
          fi

          # Action produced outputs — assert they are structurally valid
          if [ "$HAS_CRITICAL" != "true" ] && [ "$HAS_CRITICAL" != "false" ]; then
            echo "FAIL: expected has-critical to be 'true' or 'false', got: '$HAS_CRITICAL'"
            exit 1
          fi
          echo "PASS: has-critical is '$HAS_CRITICAL'"

          if [ -z "$AUDIT_SUMMARY" ]; then
            echo "FAIL: expected audit-summary to be non-empty when other outputs are set"
            exit 1
          fi
          echo "PASS: audit-summary is non-empty"
