name: Test package.json detection (prod deps only)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Commit API
        run: |
          nohup setsid python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_api.py" 18080 > /tmp/mock-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/ >/dev/null; then echo "mock up"; exit 0; fi
            sleep 0.5
          done
          cat /tmp/mock-api.log; exit 1
      - id: action
        uses: .
        with:
          packages-file: tests/fixtures/package.json
          api-url: http://127.0.0.1:18080
      - name: Assert outputs
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
          SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "has-critical: $HAS_CRITICAL"
          echo "summary: $SUMMARY"
          [ "$HAS_CRITICAL" = "false" ] || { echo "FAIL: has-critical should be false"; exit 1; }
          echo "$SUMMARY" | grep -q '`prod-alpha`' || { echo "FAIL: prod-alpha missing"; exit 1; }
          echo "$SUMMARY" | grep -q '`prod-beta`' || { echo "FAIL: prod-beta missing"; exit 1; }
          if echo "$SUMMARY" | grep -q 'dev-gamma'; then echo "FAIL: devDependency should be excluded"; exit 1; fi
          echo "PASS"
