name: Test PyPI package audit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test requirements.txt
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pypi"
          cat > "$GITHUB_WORKSPACE/test-pypi/requirements.txt" <<'EOF'
          requests>=2.28.0
          flask>=2.0.0
          EOF

      - id: action
        uses: .
        with:
          packages-file: "${{ github.workspace }}/test-pypi/requirements.txt"
          ecosystem: "pypi"
          fail-on-critical: "false"
          comment-on-pr: "false"
          max-packages: "5"

      - name: Assert has-critical output is set
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
        run: |
          echo "has-critical: $HAS_CRITICAL"
          if [ "$HAS_CRITICAL" != "true" ] && [ "$HAS_CRITICAL" != "false" ]; then
            echo "FAIL: expected has-critical to be 'true' or 'false', got: '$HAS_CRITICAL'"
            exit 1
          fi
          echo "PASS: has-critical is set to a valid value"

      - name: Assert audit-summary mentions audited packages
        env:
          AUDIT_SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "audit-summary: $AUDIT_SUMMARY"
          if [ -z "$AUDIT_SUMMARY" ]; then
            echo "FAIL: expected audit-summary to be non-empty"
            exit 1
          fi
          # Should contain at least one of the packages from requirements.txt
          if ! echo "$AUDIT_SUMMARY" | grep -qE 'requests|flask'; then
            echo "FAIL: expected audit-summary to mention 'requests' or 'flask'"
            exit 1
          fi
          echo "PASS: audit-summary contains expected Python package names"

      - name: Assert critical-count is a number
        env:
          CRITICAL_COUNT: ${{ steps.action.outputs.critical-count }}
        run: |
          echo "critical-count: $CRITICAL_COUNT"
          if ! echo "$CRITICAL_COUNT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected critical-count to be a non-negative integer, got: '$CRITICAL_COUNT'"
            exit 1
          fi
          echo "PASS: critical-count is a valid number"
