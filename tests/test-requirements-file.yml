name: Test requirements.txt packages-file parsing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake curl for the audit API
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin" /tmp/fake-curl
          rm -f /tmp/fake-curl/payloads.log
          echo ok > /tmp/fake-curl/mode
          cp tests/fixtures/fake-curl.py "$RUNNER_TEMP/fakebin/curl"
          chmod +x "$RUNNER_TEMP/fakebin/curl"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          packages-file: tests/fixtures/requirements.txt
          api-url: http://audit.invalid
          comment-on-pr: 'false'
      - name: Assert parsed packages
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
          SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          echo "payloads:"; cat /tmp/fake-curl/payloads.log
          echo "summary: $SUMMARY"
          grep -q '"packages": \["requests", "flask", "numpy"\]' /tmp/fake-curl/payloads.log || { echo "FAIL: expected requests, flask, numpy"; exit 1; }
          if [ "$HAS_CRITICAL" != "false" ]; then echo "FAIL: has-critical should be false"; exit 1; fi
          echo "$SUMMARY" | grep -q '`flask`' || { echo "FAIL: flask missing from summary"; exit 1; }
          echo "PASS"
