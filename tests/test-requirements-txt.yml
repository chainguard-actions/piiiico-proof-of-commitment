name: Test packages-file requirements.txt
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local audit API stub
        run: |
          rm -f /tmp/mock-requests.jsonl
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock_api.py" 8765 ok > /tmp/mock.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -s http://127.0.0.1:8765/ >/dev/null; then echo "stub up"; exit 0; fi
            sleep 0.5
          done
          cat /tmp/mock.log
          exit 1
      - id: action
        uses: .
        with:
          packages-file: tests/fixtures/py/requirements.txt
          ecosystem: pypi
          api-url: http://127.0.0.1:8765
          comment-on-pr: 'false'
      - name: Assert parsed packages
        env:
          HAS_CRITICAL: ${{ steps.action.outputs.has-critical }}
          SUMMARY: ${{ steps.action.outputs.audit-summary }}
        run: |
          cat /tmp/mock-requests.jsonl
          echo "summary: $SUMMARY"
          grep -q '"packages": \["requests", "flask", "pydantic", "high-newpkg"\]' /tmp/mock-requests.jsonl \
            || { echo "FAIL: unexpected parsed package list"; exit 1; }
          [ "$HAS_CRITICAL" = "false" ] || { echo "FAIL: has-critical"; exit 1; }
          echo "$SUMMARY" | grep -q '1 HIGH risk' || { echo "FAIL: HIGH headline"; exit 1; }
          echo "PASS"
